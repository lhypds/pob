<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Pob</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #111;
        --bg: #fff;
        --dim: #777;
        --page: 1100px; /* wider than the control page: this holds a screen */
        --control: 46px; /* row height and button square; ≥44px touch target */
        /* Named first, then whatever monospace the machine has: the page is
           served over a LAN with no internet behind it, so a webfont would be
           a request that never lands. Same list as the index page. */
        --code: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: var(--ink);
        background: var(--bg);
        display: flex;
        justify-content: center;
        padding: 18px 16px;
      }

      .container {
        width: 100%;
        max-width: var(--page);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .row {
        display: flex;
      }

      /* The frame is the box: the border sits on the picture's own edge, so a
         screenshot with a pale edge still ends somewhere visible. */
      #stage {
        position: relative;
        /* One grid cell, holding the canvas and the status text on top of it,
           so the text can sit over the picture without being laid out beside
           it. */
        display: grid;
        min-height: 120px;
        border: 1px solid var(--ink);
        background: var(--bg);
        line-height: 0; /* no descender gap between the image and the border */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none; /* no long-press callout on iOS */
        -webkit-tap-highlight-color: transparent;
        /* The crosshair is drawn here rather than asked for by name. The
           system one is a thin 15 px cross on macOS and a 32 px pointer with
           arms across the whole square on Windows, which over a picture of a
           screen covers the thing being aimed at. This is the same 21 px cross
           on every machine: black over a white halo, so it stays visible
           whatever the frame underneath happens to be showing, and open in the
           middle so the pixel under the hotspot is one of the ones you can
           see. The keyword stays behind it for anything that won't take an SVG
           cursor. */
        cursor:
          url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='21'%20height='21'%20viewBox='0%200%2021%2021'%3E%3Cpath%20d='M10.5%201.5v5M10.5%2014.5v5M1.5%2010.5h5M14.5%2010.5h5'%20fill='none'%20stroke='%23fff'%20stroke-width='3'%20stroke-linecap='square'/%3E%3Cpath%20d='M10.5%201.5v5M10.5%2014.5v5M1.5%2010.5h5M14.5%2010.5h5'%20fill='none'%20stroke='%23000'/%3E%3C/svg%3E")
            10 10,
          crosshair;
      }

      /* One canvas, drawn over and over. See the script for why it is a canvas
         and not a picture. */
      #frame {
        grid-area: 1 / 1;
        display: block;
        width: 100%;
        height: auto;
        /* A canvas is draggable by default, and dragging one is what this page
           does with the machine instead. */
        -webkit-user-drag: none;
      }

      #status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        font-size: 14px;
        line-height: 1.4;
        color: var(--dim);
        pointer-events: none; /* the picture underneath is the thing to click */
      }

      #status:empty {
        display: none;
      }

      /* The bottom row: how often to refetch on the left, then the text field
         and its two buttons — the same three controls as the control page. */
      #rate {
        width: 68px;
        height: var(--control);
        padding: 0 8px;
        border: 1px solid var(--ink);
        border-radius: 0; /* iOS rounds inputs by default */
        -webkit-appearance: none;
        appearance: none;
        background: var(--bg);
        color: var(--ink);
        /* Set like the values on the index page — a reading off a running
           machine. Under 16px, so iOS zooms in when it takes focus; the page
           holds a whole screen and zooming back out is one pinch. */
        font-family: var(--code);
        font-size: 13px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        outline: none;
      }

      .unit {
        display: flex;
        align-items: center;
        height: var(--control);
        padding: 0 10px;
        margin-left: -1px; /* collapse the doubled border */
        border: 1px solid var(--ink);
        color: var(--ink);
        /* Set like the small labels on the index page: the word in front of a
           reading, not the reading itself. */
        font-family: var(--code);
        font-size: 12px;
        letter-spacing: 0.02em;
        white-space: nowrap;
        user-select: none;
        -webkit-user-select: none;
      }

      #text-input {
        flex: 1;
        min-width: 0;
        height: var(--control);
        margin-left: 12px;
        padding: 0 12px;
        border: 1px solid var(--ink);
        border-right: none;
        border-radius: 0;
        -webkit-appearance: none;
        appearance: none;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        outline: none;
      }

      button {
        display: flex;
        align-items: center;
        justify-content: center;
        /* Fixed square, not aspect-ratio: Safari doesn't reliably transfer a
           flex-stretched height through aspect-ratio, leaving tiny buttons. */
        width: var(--control);
        height: var(--control);
        flex: none;
        padding: 0;
        border: 1px solid var(--ink);
        border-radius: 0;
        -webkit-appearance: none;
        appearance: none;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 18px;
        cursor: pointer;
        touch-action: manipulation; /* no double-tap zoom on repeated taps */
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      /* Marks which button is the live one; the two swap on mode change. */
      button.filled {
        background: var(--ink);
        color: var(--bg);
      }

      .row button + button {
        margin-left: -1px;
      }

      @media (hover: hover) {
        button:hover {
          opacity: 0.85;
        }
      }

      button:active {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div id="stage">
        <canvas id="frame"></canvas>
        <p id="status">Waiting for the machine…</p>
      </div>

      <div class="row">
        <input id="rate" type="number" min="0.1" max="30" step="0.1" inputmode="decimal" aria-label="Frames per second" />
        <span class="unit">fps</span>
        <input id="text-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button id="send-btn" type="button" class="filled" aria-label="Send">↵</button>
        <button id="kb-btn" type="button" aria-label="Keyboard mirror mode" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="2" y="6" width="20" height="12" />
            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8" />
          </svg>
        </button>
      </div>
    </main>
    <script src="pob.js"></script>
    <script>
      // The machine, in a picture you can click on. Each frame is a GET on the
      // instance root — the same address the commands go to — asked for as a
      // JPEG no wider than the box it is about to be drawn in, since this page
      // is watching the machine rather than reading it. That is most of what
      // makes a watchable rate possible: the bare address still answers with
      // the full-size PNG the agent works from, and that one costs an order of
      // magnitude more to make and to send.
      //
      // Shrinking the picture means it is no longer in Pob's own coordinates,
      // so every frame carries the size it would have been, and a click is
      // scaled back into that space before it is sent. See pointAt.
      //
      // The text field and the keyboard mirror are the control page's, from
      // pob.js: with a view of the machine in front of you, being able to type
      // at it is the other half of the same thing.
      const MIN_FPS = 0.1;
      const MAX_FPS = 30;
      const DEFAULT_FPS = 5;
      const FPS_KEY = "pob-view-fps"; // remembered per browser, per host

      const QUALITY = 70; // JPEG; past ~80 the bytes climb faster than the picture improves
      // Asking for exactly the box width would mean a new size on every pixel
      // of a window drag, and a shell rescaling to each one. Round up to a
      // step instead: a handful of sizes, each good for a range of widths.
      const WIDTH_STEP = 160;
      const MAX_FRAME_WIDTH = 4096;
      // A fetch that never settles would wedge the loop, since one frame is in
      // flight at a time. Long enough for a slow capture on a busy machine.
      const FRAME_TIMEOUT_MS = 10000;

      const CLICK_MOVE_THRESHOLD = 6; // px below which a gesture is a tap, not a drag
      const DOUBLE_CLICK_WINDOW_MS = 300;
      const SCROLL_PX_PER_NOTCH = 20;

      const stage = document.getElementById("stage");
      const status = document.getElementById("status");
      const rate = document.getElementById("rate");

      Pob.attachInput({
        input: document.getElementById("text-input"),
        sendBtn: document.getElementById("send-btn"),
        kbBtn: document.getElementById("kb-btn"),
      });

      // --- the frame ---------------------------------------------------------
      // One canvas, drawn over and over, because a canvas cannot blink.
      //
      // Swapping <img> elements can, and does. Two of them — load into the
      // hidden one, reveal it — blinks with an *older* picture: an element
      // goes on presenting what it had until the new picture is not merely
      // decoded but composited, which is some time after decode() says it is
      // ready, so revealing it in between brings back the frame from two ticks
      // ago for one paint. Reused elements have a past.
      //
      // A fresh element per frame has no past, but it has the opposite
      // problem, and that one is a white flash. It has to be put in and the
      // old one taken out, and requestAnimationFrame — the obvious place to
      // take the old one out — runs *before* the paint, not after. So the
      // paint that first shows the new element is the same paint that loses
      // the old one, and if the new one is not composited yet there is nothing
      // in the box for that frame: the stage's own background, which is white.
      // Once a second that is a blip. Twenty times a second it is a strobe.
      //
      // A canvas has no such moment. It presents whatever was last drawn into
      // it and goes on presenting exactly that until something else is drawn —
      // there is no swap to be caught halfway through, no element entering the
      // page with nothing to show, and nothing to take out afterwards. The
      // frame is decoded before it is drawn, and drawing it is a single
      // synchronous call that either has happened or has not.
      let period = 1000 / DEFAULT_FPS;
      let sourceW = 0; // the frame's size in screenshot pixels, which is not
      let sourceH = 0; // the picture's own size once it has been shrunk
      let loading = false; // one request at a time; a slow capture must not pile up
      let timer = null;

      const canvas = document.getElementById("frame");
      // Opaque: a screenshot has nothing to see through, and saying so lets
      // the browser skip blending the whole frame on every paint.
      const paint = canvas.getContext("2d", { alpha: false });

      // How wide a picture is worth asking for: the box it is drawn in, in
      // real device pixels, and never more. Anything past that is detail the
      // screen cannot show, paid for twice — once on the machine encoding it
      // and again on the network.
      function askedWidth() {
        const box = stage.clientWidth || document.documentElement.clientWidth || 0;
        const want = box * (window.devicePixelRatio || 1);
        if (!want) return 0; // not laid out yet; let the machine send its own size
        return Math.min(MAX_FRAME_WIDTH, Math.ceil(want / WIDTH_STEP) * WIDTH_STEP);
      }

      function frameURLFor() {
        const params = new URLSearchParams({ format: "jpeg", q: String(QUALITY) });
        const width = askedWidth();
        if (width) params.set("w", String(width));
        // A fresh URL every time. The frames are sent no-store, but a repeated
        // URL is exactly what anything in between would be tempted to answer
        // from its own copy, and one stale frame is this page's whole point
        // missed.
        params.set("t", String(Date.now()));
        return Pob.ENDPOINT + "?" + params;
      }

      async function tick() {
        if (loading || document.hidden) return;
        loading = true;

        // Fetched rather than pointed at with an <img src>, because the size
        // the frame would have been unshrunk comes back in a header, and an
        // <img> cannot read one. It is the same picture either way.
        const abort = new AbortController();
        const bail = setTimeout(() => abort.abort(), FRAME_TIMEOUT_MS);
        try {
          const response = await fetch(frameURLFor(), { cache: "no-store", signal: abort.signal });
          if (!response.ok) throw new Error("frame " + response.status);
          const width = parseInt(response.headers.get("X-Pob-Source-Width"), 10);
          const height = parseInt(response.headers.get("X-Pob-Source-Height"), 10);
          // Decoded off the main thread and handed over ready to draw, rather
          // than as an element that still has to be laid out and composited.
          // At twenty frames a second, decoding on the thread that also has to
          // answer every tap is what makes a page feel stuck.
          const bitmap = await createImageBitmap(await response.blob());
          show(bitmap, width, height);
        } catch {
          failed();
        } finally {
          clearTimeout(bail);
        }
      }

      function show(bitmap, width, height) {
        loading = false;
        // Setting either dimension clears the canvas even when the value does
        // not change, so it is worth asking first: on a resize this is the one
        // frame that starts from blank, and the rest never do.
        if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
        }
        paint.drawImage(bitmap, 0, 0);
        // An older shell reports no size, in which case the picture was never
        // shrunk and is its own source.
        sourceW = width > 0 ? width : bitmap.width;
        sourceH = height > 0 ? height : bitmap.height;
        // Held open, the decoded frames add up fast at this rate.
        bitmap.close();
        status.textContent = "";
        schedule();
      }

      function failed() {
        loading = false;
        // Keep the last frame up rather than blanking the page: the machine
        // being briefly unreachable is not news worth losing the picture over.
        if (!sourceW) status.textContent = "Cannot reach the machine.";
        schedule();
      }

      // The clock starts when a frame lands, not when one was asked for: a
      // capture slower than the interval would otherwise queue up requests
      // nobody will ever see.
      function schedule() {
        clearTimeout(timer);
        timer = null;
        if (document.hidden) return;
        timer = setTimeout(tick, period);
      }

      function setFPS(fps, remember) {
        if (!isFinite(fps)) fps = DEFAULT_FPS;
        fps = Math.min(MAX_FPS, Math.max(MIN_FPS, fps));
        period = 1000 / fps;
        if (remember) {
          try {
            localStorage.setItem(FPS_KEY, String(fps));
          } catch {
            // Private browsing refuses to store; the rate just won't be kept.
          }
        }
        return fps;
      }

      // Typing in the field takes effect on the next frame, not on the next
      // keystroke: rewriting "10" one character at a time would otherwise pass
      // through 1 fps on the way, and wait a whole second there.
      rate.addEventListener("change", () => {
        rate.value = setFPS(parseFloat(rate.value), true);
        schedule();
      });

      // A backgrounded tab is nobody watching, and every frame costs the
      // machine a screen capture. Stop asking until it comes back.
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          clearTimeout(timer);
          timer = null;
        } else {
          tick();
        }
      });

      // --- clicking on it ----------------------------------------------------
      // The frame is drawn to fit the box, so a point on screen is that same
      // point in the screenshot scaled by however much it was shrunk to get
      // there. Two shrinks, in fact: the machine shrank the picture before
      // sending it, and the box shrank it again to fit. Scaling by the source
      // size rather than the picture's own size undoes both at once — using
      // the canvas's own width here instead would land every click short by
      // exactly the first of them.
      function pointAt(e) {
        const box = canvas.getBoundingClientRect();
        // No source size means no frame has landed yet, so there is nothing
        // on screen to have clicked on.
        if (!sourceW || !sourceH || !box.width || !box.height) return null;
        return [
          Math.round((e.clientX - box.left) * (sourceW / box.width)),
          Math.round((e.clientY - box.top) * (sourceH / box.height)),
        ];
      }

      let start = null; // where the press went down, in screenshot pixels
      let startClient = null; // and on screen, to measure the slop against
      let dragging = false; // past the slop: Pob is holding the button
      let pendingClickTimer = null; // a click held back in case a second tap follows
      let claimed = false; // this gesture claimed a pending click, so it is the second tap

      stage.addEventListener("contextmenu", (e) => e.preventDefault());

      stage.addEventListener("pointerdown", (e) => {
        // Don't steal focus: mid-mirroring, a tap here would otherwise blur
        // the text field and close the soft keyboard being mirrored.
        e.preventDefault();
        const point = pointAt(e);
        if (!point) return;
        stage.setPointerCapture(e.pointerId);
        start = point;
        startClient = [e.clientX, e.clientY];
        dragging = false;
        // A touch inside the double-click window is the second half of a
        // double-tap: claim the click that was held back, and let this
        // gesture's lift decide whether it was a double-click or a drag.
        claimed = false;
        if (pendingClickTimer) {
          clearTimeout(pendingClickTimer);
          pendingClickTimer = null;
          claimed = true;
        }
      });

      stage.addEventListener("pointermove", (e) => {
        if (!start) return;
        const point = pointAt(e);
        if (!point) return;
        if (!dragging) {
          if (Math.hypot(e.clientX - startClient[0], e.clientY - startClient[1]) <= CLICK_MOVE_THRESHOLD) {
            return; // still a tap as far as anyone knows
          }
          // Past the slop: grab where the finger went down, not where it is
          // now, so the drag picks up what was under it to begin with.
          dragging = true;
          Pob.enqueue(`mouse=MOVE_TO(${start[0]},${start[1]})`);
          Pob.enqueue("mouse=PRESS(0,0)");
        }
        // Coalesced: the newest position is the only one worth sending.
        Pob.moveTo(point[0], point[1]);
        Pob.pump();
      });

      function endGesture(e) {
        if (!start) return;
        const point = pointAt(e) || start;
        const wasDragging = dragging;
        const secondTap = claimed;
        start = null;
        dragging = false;
        claimed = false;
        // Only if it is actually held: releasing a pointer that was never
        // captured throws, and pointerup releases it implicitly anyway.
        if (stage.hasPointerCapture?.(e.pointerId)) stage.releasePointerCapture(e.pointerId);

        if (wasDragging) {
          // Put the last position in the queue rather than leaving it
          // coalesced, so the release cannot overtake the move that says
          // where the drop happened.
          Pob.moveTo(point[0], point[1]);
          Pob.flushMoveTo();
          Pob.enqueue("mouse=RELEASE(0,0)");
          return;
        }

        Pob.enqueue(`mouse=MOVE_TO(${point[0]},${point[1]})`);
        if (e.button === 2) {
          Pob.enqueue("mouse=RIGHT_CLICK(0,0)");
          return;
        }
        if (secondTap) {
          Pob.enqueue("mouse=DOUBLE_CLICK(0,0)");
          return;
        }
        // Hold the single click back for a moment: a second tap turns it into
        // a double-click, and a click already sent cannot be taken back.
        pendingClickTimer = setTimeout(() => {
          pendingClickTimer = null;
          Pob.enqueue("mouse=CLICK(0,0)");
        }, DOUBLE_CLICK_WINDOW_MS);
      }

      // A cancelled gesture (the system took over the touch, e.g. an edge
      // swipe) must not turn into a click — but a held button must still be
      // let go, or it stays stuck down on the target machine.
      function cancelGesture() {
        const wasDragging = dragging;
        start = null;
        dragging = false;
        claimed = false;
        if (wasDragging) Pob.enqueue("mouse=RELEASE(0,0)");
      }

      stage.addEventListener("pointerup", endGesture);
      stage.addEventListener("pointercancel", cancelGesture);

      // Scrolling acts where the pointer is, so go there first.
      stage.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const point = pointAt(e);
          if (point) Pob.moveTo(point[0], point[1]);
          // deltaMode 1 is lines (~3 per wheel notch); pixels (~100) otherwise.
          Pob.scrollBy(-(e.deltaMode === 1 ? e.deltaY / 3 : e.deltaY / 100));
          Pob.pump();
        },
        { passive: false },
      );

      let saved = null;
      try {
        saved = localStorage.getItem(FPS_KEY);
      } catch {
        // Storage is unreadable here; the default rate stands.
      }
      rate.value = setFPS(saved === null ? DEFAULT_FPS : parseFloat(saved), false);
      tick();
    </script>
  </body>
</html>
