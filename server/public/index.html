<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pob</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #111;
        --bg: #fff;
        --dim: #777;
        --rule: #e6e6e6;
        --page: 630px;
        --control: 46px; /* row height, matching the control page */
        /* Named first, then whatever monospace the machine has: the page is
           served over a LAN with no internet behind it, so a webfont would be
           a request that never lands. It looks right where the font is
           installed and ordinary where it isn't. */
        --code: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: var(--ink);
        background: var(--bg);
        display: flex;
        justify-content: center;
        padding: 18px 16px;
      }

      .container {
        width: 100%;
        max-width: var(--page);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-family: var(--code);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      /* One box per section, sharing the control page's flat 1px border. */
      .box {
        border: 1px solid var(--ink);
      }

      .box h2 {
        margin: 0;
        padding: 0 12px;
        height: var(--control);
        display: flex;
        align-items: center;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--ink);
      }

      dl {
        margin: 0;
        display: grid;
        /* The value column takes the slack, so the labels stay a straight
           edge however long the paths and model names get. */
        grid-template-columns: minmax(88px, auto) 1fr;
      }

      dt,
      dd {
        margin: 0;
        padding: 9px 12px;
        min-width: 0;
        line-height: 18px; /* one height for both, so the two columns sit level */
      }

      /* A label, not a reading: set like the GET and POST below it, which is
         the same job in the same place — the small word in front that says
         what the line to its right is. */
      dt {
        font-family: var(--code);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--dim);
      }

      /* The same face and size as the endpoints below: these are values read
         off a running machine — ids, paths, model names — and they line up and
         read better set the way the addresses are. */
      dd {
        font-family: var(--code);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      dt + dd + dt,
      dt + dd + dt + dd {
        border-top: 1px solid var(--rule);
      }

      /* Two lists: pages you click, endpoints you call. Same row shape, but
         only one of them is somewhere to go. */
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li + li {
        border-top: 1px solid var(--rule);
      }

      li > a,
      li > .row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 11px 12px;
        color: var(--ink);
        text-decoration: none;
      }

      li > a:hover {
        background: #f4f4f4;
      }

      /* An endpoint is called, not visited, so its address is there to be read
         and copied rather than followed — one click takes the whole of it, and
         only it, which is why the caption is a sibling and not inside. */
      li > .row .url {
        user-select: all;
      }

      .method {
        flex: none;
        width: 46px;
        font-family: var(--code);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--dim);
      }

      .text {
        min-width: 0; /* lets a long address wrap instead of widening the row */
      }

      .url {
        display: block;
        font-family: var(--code);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .what {
        display: block;
        margin-top: 3px;
        font-size: 13px;
        color: var(--dim);
      }

      .note {
        margin: 0;
        font-size: 13px;
        color: var(--dim);
      }

      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 7px;
        border: 1px solid var(--ink);
        border-radius: 50%;
        vertical-align: 1px;
      }

      .dot.on {
        background: var(--ink);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Pob</h1>

      <section class="box">
        <h2>Instance</h2>
        <dl>
          <dt>ID</dt>
          <dd id="instance">…</dd>
          <dt>Root</dt>
          <dd id="root">…</dd>
          <dt>Model</dt>
          <dd id="model">…</dd>
          <dt>Executing</dt>
          <dd id="executing">…</dd>
          <dt>Recording</dt>
          <dd id="recording">…</dd>
          <dt>MCP</dt>
          <dd id="mcp">…</dd>
          <dt>Server</dt>
          <dd id="port">…</dd>
        </dl>
      </section>

      <section class="box">
        <h2>Pages</h2>
        <ul id="pages">
          <li><a href="#">…</a></li>
        </ul>
      </section>

      <section class="box">
        <h2>Endpoints</h2>
        <ul id="endpoints">
          <li><span class="row">…</span></li>
        </ul>
      </section>

      <p class="note" id="note"></p>
    </main>

    <script>
      // The index: what is running here, and where to go on with it. The bare
      // root is deliberately not the machine itself — that address is one path
      // element further along, and it is the one this page hands out.
      const STATUS_MS = 3000;

      const $ = (id) => document.getElementById(id);
      const yesNo = (v) => (v ? "yes" : "no");

      // What is where, given the instance id. Built from this page's own
      // origin, so whatever host and port got here is what gets handed on.
      //
      // The same address twice under Endpoints, once per method: a GET there
      // is a picture of the machine and a POST is a command to it, and those
      // are two different things to know about, not one row with two words in
      // front of it.
      function pages(machine) {
        return [
          [machine + "/control", "drive it: type, keyboard, trackpad"],
          [machine + "/view", "watch it, and click straight on it"],
        ];
      }

      function endpoints(machine) {
        return [
          ["GET", machine, "a PNG of the machine as it is right now"],
          ["POST", machine, "one command, as text/plain — typing, keycode, mouse"],
          ["GET", machine + "/status", "everything on this page, as JSON"],
        ];
      }

      function fill(status) {
        document.title = status.instance ? "Pob — " + status.instance : "Pob";

        $("instance").textContent = status.instance || "—";
        $("root").textContent = status.root || "—";
        $("model").textContent = status.model || "—";
        $("executing").innerHTML =
          dot(status.executing) +
          (status.executing && status.session
            ? "yes — session " + escapeText(status.session)
            : yesNo(status.executing));
        $("recording").innerHTML = dot(status.recording) + yesNo(status.recording);
        $("mcp").innerHTML = status.mcp
          ? dot(true) + "running — " + escapeText(status.mcp)
          : dot(false) + "stopped";
        $("port").innerHTML = dot(true) + "running on port " + escapeText(String(status.port || ""));

        // Only rebuild the lists when they have actually changed: one of them
        // is links, and relaying them under a hovering finger every few
        // seconds would be its own small annoyance.
        const machine = location.origin + "/" + status.instance;
        if (machine !== listed) {
          listed = machine;
          $("pages").innerHTML = pages(machine)
            .map(
              ([href, what]) =>
                `<li><a href="${escapeText(href)}"><span class="text">` +
                `<span class="url">${escapeText(href)}</span>` +
                `<span class="what">${what}</span></span></a></li>`,
            )
            .join("");
          $("endpoints").innerHTML = endpoints(machine)
            .map(
              ([method, url, what]) =>
                `<li><span class="row"><span class="method">${method}</span><span class="text">` +
                `<span class="url">${escapeText(url)}</span>` +
                `<span class="what">${what}</span></span></span></li>`,
            )
            .join("");
        }

        // One line per network the machine is on: which of them a phone can
        // reach depends on where the phone is.
        const elsewhere = (status.urls || []).filter((u) => !u.startsWith(location.origin + "/"));
        $("note").textContent = elsewhere.length ? "Also reachable at " + elsewhere.join(", ") : "";
      }

      function dot(on) {
        return '<span class="dot' + (on ? " on" : "") + '"></span>';
      }

      // Everything here comes off the machine's own status, but it is put into
      // the page as markup, so it gets escaped like anything else would.
      function escapeText(value) {
        return String(value).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      let listed = "";

      async function refresh() {
        try {
          const resp = await fetch("status", { cache: "no-store" });
          if (!resp.ok) throw new Error(resp.status);
          fill(await resp.json());
        } catch {
          $("note").textContent = "Lost the instance — it may have been quit.";
        }
      }

      refresh();
      setInterval(refresh, STATUS_MS);
    </script>
  </body>
</html>
