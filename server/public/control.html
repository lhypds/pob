<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Pob</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #111;
        --bg: #fff;
        --pad: 630px;
        --control: 46px; /* row height and button square; ≥44px touch target */
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: var(--ink);
        display: flex;
        justify-content: center;
        padding: 18px 16px;
      }

      .container {
        width: 100%;
        max-width: var(--pad);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .row {
        display: flex;
      }

      #text-input {
        flex: 1;
        min-width: 0;
        height: var(--control);
        padding: 0 12px;
        border: 1px solid var(--ink);
        border-right: none;
        border-radius: 0; /* iOS rounds inputs by default */
        -webkit-appearance: none;
        appearance: none;
        background: var(--bg);
        color: var(--ink);
        font: inherit; /* stays ≥16px so iOS doesn't zoom in on focus */
        outline: none;
      }

      button {
        display: flex;
        align-items: center;
        justify-content: center;
        /* Fixed square, not aspect-ratio: Safari doesn't reliably transfer a
           flex-stretched height through aspect-ratio, leaving tiny buttons. */
        width: var(--control);
        height: var(--control);
        flex: none;
        padding: 0;
        border: 1px solid var(--ink);
        border-radius: 0;
        -webkit-appearance: none;
        appearance: none;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 18px;
        cursor: pointer;
        touch-action: manipulation; /* no double-tap zoom on repeated taps */
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none; /* no long-press callout on iOS */
      }

      /* Marks which button is the live one; the two swap on mode change. */
      button.filled {
        background: var(--ink);
        color: var(--bg);
      }

      .row button + button {
        margin-left: -1px; /* collapse the doubled border between buttons */
      }

      /* Hover only where hover exists — on touch it sticks after a tap. */
      @media (hover: hover) {
        button:hover {
          opacity: 0.85;
        }
      }

      button:active {
        opacity: 0.7;
      }

      #trackpad {
        --chrome: 100px; /* body padding + input row + gap */
        width: 100%;
        height: var(--pad);
        max-height: calc(100vh - var(--chrome));
        max-height: calc(100dvh - var(--chrome)); /* iOS Safari: vh extends behind the URL bar */
        background: #f9f9f9;
        border: 1px solid var(--ink);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none; /* no long-press callout on iOS */
        -webkit-tap-highlight-color: transparent;
      }

      #trackpad.active {
        background: #e2e2e2;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="row">
        <input id="text-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <!-- Drawn rather than typed as ↵. A character is placed by its
             line box and its ink sits well above the baseline, which put the
             arrow a fifth of the square high; a path is placed by its own
             box, the same as the icons beside it, on every machine's fonts. -->
        <button id="send-btn" type="button" class="filled" aria-label="Send">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 5.5v8.5H4m4.5-4.5L4 14l4.5 4.5" />
          </svg>
        </button>
        <button id="kb-btn" type="button" aria-label="Keyboard mirror mode" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="2" y="6" width="20" height="12" />
            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8" />
          </svg>
        </button>
      </div>

      <div id="trackpad"></div>
    </main>
    <script src="pob.js"></script>
    <script>
      // The queue, the text field, the keyboard mirror and the trackpad all
      // live in pob.js, shared with the view page. What is left here is fitting
      // the pad around the soft keyboard, which is this page's own.
      Pob.attachInput({
        input: document.getElementById("text-input"),
        sendBtn: document.getElementById("send-btn"),
        kbBtn: document.getElementById("kb-btn"),
      });

      const trackpad = document.getElementById("trackpad");
      trackpad.addEventListener("contextmenu", (e) => e.preventDefault());

      // The whole pad — every gesture it understands — is pob.js's, shared
      // with the view page, which offers the same pointing as one of its two
      // modes. All this page adds is showing that a finger is down.
      Pob.attachTrackpad(trackpad, {
        onActive: (on) => trackpad.classList.toggle("active", on),
      });

      // The CSS dvh cap doesn't account for the soft keyboard (dvh ignores
      // it); the visual viewport does, so track it to keep the whole pad
      // reachable above the keyboard while mirroring.
      if (window.visualViewport) {
        const fitTrackpad = () => {
          // 100 matches the trackpad's --chrome: input row plus page padding.
          trackpad.style.maxHeight = Math.max(120, window.visualViewport.height - 100) + "px";
        };
        window.visualViewport.addEventListener("resize", fitTrackpad);
        fitTrackpad();
      }
    </script>
  </body>
</html>
