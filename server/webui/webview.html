<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pob</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        /* Black, unlike the control page: the frame is the only thing here,
           and anything lighter around it reads as part of the machine. */
        background: #000;
        color: #888;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      /* Two frames stacked in the same place: the next one loads in the
         hidden one and they swap once it has arrived, so the page never
         flashes empty between refreshes. */
      .frame {
        position: absolute;
        inset: 0;
        margin: auto;
        max-width: 100%;
        max-height: 100%;
        visibility: hidden;
      }

      .frame.shown {
        visibility: visible;
      }

      #status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        pointer-events: none;
      }

      #status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <img id="frame-a" class="frame" alt="" />
    <img id="frame-b" class="frame" alt="" />
    <p id="status">Waiting for the machine…</p>

    <script>
      // A view of the machine, one frame a second. The frame is a plain GET on
      // the instance root — the same address the control page POSTs to — so
      // this page is only the thing that asks for it repeatedly.
      const REFRESH_MS = 1000;

      // The root is this page's own path with /view taken off, which is what
      // keeps the page working however it was reached: by instance name, by
      // bare address, on whatever port the machine was given.
      const ROOT = location.pathname.replace(/\/view\/?$/, "/");

      const frames = [document.getElementById("frame-a"), document.getElementById("frame-b")];
      const status = document.getElementById("status");

      let shown = 0; // which of the two frames is on screen
      let started = false; // a frame has arrived at least once
      let loading = false; // one request at a time; a slow capture must not pile up
      let timer = null;

      function tick() {
        if (loading || document.hidden) return;
        loading = true;
        const back = frames[1 - shown];
        back.onload = () => {
          loading = false;
          frames[shown].classList.remove("shown");
          back.classList.add("shown");
          shown = 1 - shown;
          started = true;
          status.textContent = "";
          schedule();
        };
        back.onerror = () => {
          loading = false;
          // Keep the last frame up rather than blanking the page: the machine
          // being briefly unreachable is not news worth losing the picture over.
          status.textContent = started ? "" : "Cannot reach the machine.";
          schedule();
        };
        // A fresh URL every time. The frames are sent no-store, but a repeated
        // URL is exactly what anything in between would be tempted to answer
        // from its own copy, and one stale frame is this page's whole point
        // missed.
        back.src = ROOT + "?t=" + Date.now();
      }

      // A second after the last frame landed, not a second after the last one
      // was asked for: a capture slower than the interval would otherwise
      // queue up requests the watcher will never see.
      function schedule() {
        clearTimeout(timer);
        if (document.hidden) return;
        timer = setTimeout(tick, REFRESH_MS);
      }

      // A backgrounded tab is nobody watching, and every frame costs the
      // machine a screen capture. Stop asking until it comes back.
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          clearTimeout(timer);
          timer = null;
        } else {
          tick();
        }
      });

      tick();
    </script>
  </body>
</html>
